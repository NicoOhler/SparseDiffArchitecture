name: 'custom'
datadir: 'data/custom/'
random_subset: null
pin_memory: True
molecules: False
spectre: False
regenerate_dataset: True       # whether to regenerate the dataset even if it already exists
visualize: False                # whether to create visualizations of the graphs
type: 'random_walk'                     # type of dataset: 'shape' or 'random_walk'
grid_shape: [8, 8]              # shape of the 2D coordinate grid
num_graphs: 5000                         # number of graphs to generate for the dataset
weight_range: [0.1, 3.0]             # range of edge weights
shape_types: ['rectangle']              # list of shape types to include in the dataset (shape dataset)
min_edges: 30                           # minimum number of edges in each graph (random walk dataset)
max_edges: 75                           # maximum number of edges in each graph (random walk dataset)